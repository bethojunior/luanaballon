# Uso local: docker compose -f docker-compose.dev.yml up -d  &&  npm run dev
services:
  mysql:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: luana
      MYSQL_USER: luana
      MYSQL_PASSWORD: luana
    ports: ["8506:3306"]
    volumes: [mysql_dev:/var/lib/mysql]
  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["8500:9000", "8501:9001"]
    volumes: [minio_dev:/bitnami/minio/data]

volumes:
  mysql_dev:
  minio_dev:
