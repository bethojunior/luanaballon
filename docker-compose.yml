services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: luana
      DB_USER: ${MYSQL_USER:?defina MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-luana}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET:?defina AUTH_SECRET}
    ports:
      - "${WEB_PORT:-8580}:8580"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [internal]

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: luana
      MYSQL_USER: ${MYSQL_USER:?defina MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?defina MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      # console do MinIO apenas via localhost (acesse com túnel SSH: ssh -L 8501:localhost:8501 root@SEU_IP)
      - "127.0.0.1:8501:9001"
    networks: [internal]

networks:
  internal:

volumes:
  mysql_data:
  minio_data:
